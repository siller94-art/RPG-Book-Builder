<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Companion UI harness</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../../styles/companion.css">
<style>
  /* Rough stand-in for Foundry v13+ window chrome so the module's own styles can be judged. */
  html, body { margin: 0; height: 100%; background: #0c0d10 url() center/cover; font-family: "Signika", system-ui, sans-serif; color: #ddd; font-size: 14px; }
  #board { position: fixed; inset: 0; z-index: 2; pointer-events: none; background: radial-gradient(circle at 30% 20%, #26313b, #0b0d10 70%); }
  .application { position: absolute; pointer-events: auto; top: 24px; left: 24px; display: flex; flex-direction: column; border-radius: 6px; box-shadow: 0 0 20px #000; border: 1px solid #333; overflow: hidden; background: #0b0a13; }
  .application .window-header { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; background: #0b0a13; color: #efe6d8; font-size: 14px; flex: none; }
  .application .window-header h1 { font-size: 14px; margin: 0; flex: 1; font-weight: 600; }
  .application .window-header button { background: none; border: 0; color: #aaa; font-size: 18px; cursor: pointer; }
  .application .window-content { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .application .window-content > * { flex: 1; min-height: 0; }
  #sidebar { position: fixed; right: 0; top: 0; bottom: 0; width: 300px; background: #111; border-left: 1px solid #333; display: flex; flex-direction: column; gap: 14px; padding: 8px; box-sizing: border-box; }
  .directory-header .header-actions { display: flex; flex-wrap: wrap; gap: 4px; }
  .directory-header .header-actions > button:not(.rpgbb-header-button) { flex: 1; min-height: 28px; background: #222; color: #ddd; border: 1px solid #444; border-radius: 4px; }
  .directory-header h4 { margin: 0 0 6px; color: #aaa; font-weight: 400; }
</style>
</head>
<body>
<div id="board"></div>
<div id="sidebar">
  <section id="journal"><div class="directory-header"><h4>Journal</h4><div class="header-actions"><button>Create Entry</button><button>Create Folder</button></div></div></section>
  <section id="actors"><div class="directory-header"><h4>Actors</h4><div class="header-actions"><button>Create Actor</button><button>Create Folder</button></div></div></section>
  <section id="items"><div class="directory-header"><h4>Items</h4><div class="header-actions"><button>Create Item</button><button>Create Folder</button></div></div></section>
</div>
<script type="module" src="./harness.mjs"></script>
</body>
</html>
