[package]
name = "rpg-book-builder"
version = "0.1.0"
description = "RPG Campaign Creator desktop app"
authors = ["RPG Book Builder"]
edition = "2021"

[lib]
name = "rpg_book_builder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
