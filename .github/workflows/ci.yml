name: CI
on:
  push:
  pull_request:
jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
  desktop-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macOS
          - os: windows-latest
            artifact: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - name: Generate desktop icons
        shell: bash
        run: |
          mkdir -p src-tauri/icons
          node - <<'NODE'
          const fs=require('fs');
          const png=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAMUlEQVR4nO3OMQEAIAzAMMC/5yFjRxMFfXpn5g5gUQhYFAIWhYBFIWBRCFgUAhbFALgABm4CPxZ7b0wAAAAASUVORK5CYII=','base64');
          fs.writeFileSync('src-tauri/icons/icon.png',png);
          const head=Buffer.alloc(22);head.writeUInt16LE(0,0);head.writeUInt16LE(1,2);head.writeUInt16LE(1,4);head[6]=32;head[7]=32;head.writeUInt16LE(1,10);head.writeUInt16LE(32,12);head.writeUInt32LE(png.length,14);head.writeUInt32LE(22,18);
          fs.writeFileSync('src-tauri/icons/icon.ico',Buffer.concat([head,png]));
          NODE
          file src-tauri/icons/icon.png src-tauri/icons/icon.ico || true
      - run: npm run tauri -- build
      - uses: actions/upload-artifact@v4
        with:
          name: RPG-Book-Builder-${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: error
