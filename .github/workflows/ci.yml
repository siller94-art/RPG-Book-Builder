name: CI
on:
  push:
  pull_request:
jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
  desktop-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macOS
          - os: windows-latest
            artifact: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - name: Generate desktop icons
        shell: bash
        run: |
          python - <<'PY'
          import os, struct, zlib, binascii
          os.makedirs('src-tauri/icons', exist_ok=True)
          w=h=32
          raw=b''.join(b'\\x00'+b'\\x7c\\x30\\x2b\\xff'*w for _ in range(h))
          def chunk(t,d): return struct.pack('>I',len(d))+t+d+struct.pack('>I',binascii.crc32(t+d)&0xffffffff)
          png=b'\\x89PNG\\r\\n\\x1a\\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(raw))+chunk(b'IEND',b'')
          open('src-tauri/icons/icon.png','wb').write(png)
          ico=struct.pack('<HHH',0,1,1)+struct.pack('<BBBBHHII',32,32,0,0,1,32,len(png),22)+png
          open('src-tauri/icons/icon.ico','wb').write(ico)
          PY
      - run: npm run tauri -- build
      - uses: actions/upload-artifact@v4
        with:
          name: RPG-Book-Builder-${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: error
