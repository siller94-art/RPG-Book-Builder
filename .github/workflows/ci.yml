name: CI
on:
  push:
  pull_request:
jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm test
  desktop-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macOS
          - os: windows-latest
            artifact: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - name: Generate desktop icons with Tauri
        shell: bash
        run: |
          mkdir -p src-tauri/icons
          node - <<'NODE'
          const fs=require('fs'),zlib=require('zlib');
          const crc=(buf)=>{let c=0xffffffff;for(const x of buf){c^=x;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0)}return (c^0xffffffff)>>>0};
          const chunk=(t,d)=>{const tb=Buffer.from(t),n=Buffer.alloc(4),r=Buffer.alloc(4);n.writeUInt32BE(d.length);r.writeUInt32BE(crc(Buffer.concat([tb,d])));return Buffer.concat([n,tb,d,r])};
          const w=512,h=512,rows=[];for(let y=0;y<h;y++){const row=Buffer.alloc(1+w*4);for(let x=0;x<w;x++){const i=1+x*4;row[i]=36;row[i+1]=45;row[i+2]=58;row[i+3]=255}rows.push(row)}
          const sig=Buffer.from([137,80,78,71,13,10,26,10]),ih=Buffer.alloc(13);ih.writeUInt32BE(w,0);ih.writeUInt32BE(h,4);ih[8]=8;ih[9]=6;
          fs.writeFileSync('src-tauri/app-icon.png',Buffer.concat([sig,chunk('IHDR',ih),chunk('IDAT',zlib.deflateSync(Buffer.concat(rows))),chunk('IEND',Buffer.alloc(0))]));
          NODE
          npm run tauri -- icon src-tauri/app-icon.png -o src-tauri/icons
      - name: Build desktop app
        env:
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: npm run tauri -- build
      - name: Verify macOS bundle signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          codesign --verify --deep --strict --verbose=4 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 || true
          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            spctl --assess --type execute --verbose=4 "$APP"
          else
            echo "::notice::Ad-hoc signed macOS development build. Developer ID + notarization are required for a frictionless public release."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: RPG-Book-Builder-${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: error
