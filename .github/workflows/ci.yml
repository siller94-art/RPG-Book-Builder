name: RPG Book Builder CI
# trigger: validate editor MVP
on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --bundles dmg
            artifact: macos-dmg-editor-mvp
            path: src-tauri/target/release/bundle/dmg/*.dmg
          - platform: windows-latest
            args: --bundles nsis
            artifact: windows-installer-editor-mvp
            path: src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - name: Test
        run: npm test
      - name: Web production build
        run: npm run build
      - name: Desktop bundle
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: npm run tauri -- build ${{ matrix.args }}
      - name: Verify macOS bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          codesign --verify --deep --strict --verbose=4 "$APP"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
