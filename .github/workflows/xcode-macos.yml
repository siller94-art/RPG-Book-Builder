name: Xcode macOS Validation
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]
permissions:
  contents: read
concurrency:
  group: xcode-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xcode-macos:
    name: Xcode toolchain macOS test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Show Xcode and macOS SDK
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          xcrun --sdk macosx --show-sdk-version
      - name: Install dependencies
        run: npm install
      - name: Xcode toolchain tests
        run: npm run mac:xcode:check
      - name: Generate desktop icons
        run: npm run tauri -- icon src-tauri/app-icon.svg
      - name: Build macOS app bundle
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri -- build --bundles app
      - name: Inspect app bundle
        run: |
          APP_PATH="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          plutil -p "$APP_PATH/Contents/Info.plist"
          codesign -dv --verbose=2 "$APP_PATH" 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: xcode-macos-app
          path: src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error
