name: Foundry Module Release

on:
  push:
    tags:
      - 'foundry-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read module version
        id: module
        shell: bash
        run: |
          VERSION=$(node -p "require('./foundry-module/module.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          test "foundry-v$VERSION" = "$GITHUB_REF_NAME"

      - name: Build module ZIP
        shell: bash
        run: |
          mkdir -p release/rpg-book-builder-companion
          cp -R foundry-module/module.json foundry-module/scripts foundry-module/styles foundry-module/README.md release/rpg-book-builder-companion/
          cd release
          zip -r ../rpg-book-builder-companion.zip rpg-book-builder-companion
          cd ..
          cp foundry-module/module.json ./module.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: RPG Book Builder Companion v${{ steps.module.outputs.version }}
          generate_release_notes: true
          files: |
            rpg-book-builder-companion.zip
            module.json
