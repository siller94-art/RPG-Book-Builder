name: Desktop Build
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main", "feature/dnd-campaign-creator-foundation"]
    tags: ["v*"]
permissions:
  contents: write
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build and test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - name: Dependency security audit
        run: npm audit --audit-level=critical
      - name: Test
        run: npm test
      - name: Web production build
        run: npm run build
      - name: Generate desktop icons
        run: npm run tauri -- icon src-tauri/app-icon.svg
      - name: Desktop bundle
        run: npm run tauri -- build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    name: macOS build and test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - name: Dependency security audit
        run: npm audit --audit-level=critical
      - name: Test
        run: npm test
      - name: Web production build
        run: npm run build
      - name: Generate desktop icons
        run: npm run tauri -- icon src-tauri/app-icon.svg
      - name: Desktop bundle
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri -- build --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    name: Publish tagged desktop release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download tested installers
        uses: actions/download-artifact@v4
        with:
          pattern: '*-installer'
          path: release-assets
          merge-multiple: true
      - name: Download tested macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: release-assets
      - name: Verify release assets
        shell: bash
        run: |
          test -n "$(find release-assets -type f -name '*.exe' -print -quit)"
          test -n "$(find release-assets -type f -name '*.dmg' -print -quit)"
          find release-assets -type f -maxdepth 2 -print
      - name: Publish release with tested installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mapfile -t FILES < <(find release-assets -type f \( -name '*.exe' -o -name '*.dmg' \) -print)
          gh release create "$GITHUB_REF_NAME" "${FILES[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "RPG Book Builder $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
