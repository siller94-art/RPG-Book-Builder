name: Desktop Build
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main", "feature/dnd-campaign-creator-foundation"]
    tags: ["v*"]
permissions:
  contents: write
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build and test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - name: Test
        run: npm test
      - name: Web production build
        run: npm run build
      - name: Generate desktop icons
        run: npm run tauri -- icon src-tauri/app-icon.svg
      - name: Desktop bundle
        run: npm run tauri -- build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    name: macOS build and test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - name: Test
        run: npm test
      - name: Web production build
        run: npm run build
      - name: Generate desktop icons
        run: npm run tauri -- icon src-tauri/app-icon.svg
      - name: Desktop bundle
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri -- build --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    name: Attach installers to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: List installers
        run: ls -la installers
      # Uses the installers built and tested above instead of rebuilding them.
      # Creates a draft release for new tags; if a release for the tag already
      # exists, the files are added to it. Publish the draft on the Releases page.
      - uses: softprops/action-gh-release@v2
        with:
          name: RPG Book Builder ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            installers/*.exe
            installers/*.dmg
