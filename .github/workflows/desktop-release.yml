name: Desktop Build
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main", "feature/dnd-campaign-creator-foundation"]
    tags: ["v*"]
permissions:
  contents: write
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build and test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - name: Test
        run: npm test
      - name: Web production build
        run: npm run build
      - name: Generate desktop icons
        run: npm run tauri -- icon src-tauri/app-icon.svg
      - name: Desktop bundle
        run: npm run tauri -- build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - uses: tauri-apps/tauri-action@v0
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: RPG Campaign Creator ${{ github.ref_name }}
          releaseBody: Windows desktop build.
          releaseDraft: true
          prerelease: false
          args: --bundles nsis

  macos:
    name: macOS build and test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - name: Test
        run: npm test
      - name: Web production build
        run: npm run build
      - name: Generate desktop icons
        run: npm run tauri -- icon src-tauri/app-icon.svg
      - name: Desktop bundle
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri -- build --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - uses: tauri-apps/tauri-action@v0
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: RPG Campaign Creator ${{ github.ref_name }}
          releaseBody: macOS desktop build.
          releaseDraft: true
          prerelease: false
          args: --bundles dmg
